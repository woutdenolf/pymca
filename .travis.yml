
dist: xenial
sudo: required

language: python

matrix:
    include:
        - python: 2.7
          os: linux
          env:
              - BUILD_COMMAND=sdist
              - QT_BINDING=PySide2

        - python: 3.6
          os: linux
          env:
              - BUILD_COMMAND=sdist
              - QT_BINDING=PyQt5

        - language: generic
          os: osx
          env: 
              - BUILD_COMMAND=bdist_wheel
              - PYTHON_VERSION=2
              - QT_BINDING=PySide2

        - language: generic
          os: osx
          env: 
              - BUILD_COMMAND=bdist_wheel
              - PYTHON_VERSION=3
              - QT_BINDING=PyQt5

cache:
    apt: true

addons:
    apt:
        packages:
            - libegl1-mesa  # Required by Qt xcb platform plugin
            - libgl1-mesa-glx  # For OpenGL
            - xserver-xorg-video-dummy  # For OpenGL
            - libxkbcommon-x11-0 # needed for Qt plugins
            - libxkbcommon0
            - libxkbcommon-dev

before_install:
    # On MacOS: install python3 if needed
    - source ./ci/travis_osx.sh

    # Start X server with dummy video dirver
    # Use this instead of Xvfb to have RANDR extension
    # Otherwise there is a bug with Qt5.10.0
    - if [ "$TRAVIS_OS_NAME" == "llinux" ];
      then
          export DISPLAY=:99.0;
          ls -l /dev/tty0;
          sudo Xorg -noreset +extension GLX +extension RANDR +extension RENDER -logfile ./99.log -config ./ci/travis_xorg.conf :99 &
          sleep 3;
          cat ./99.log;
          ls -l /dev/tty0;
      fi
    - if [ "$TRAVIS_OS_NAME" == "linux" ];
      then
          export DISPLAY=:99.0;
          sh -e /etc/init.d/xvfb start;
      fi

install:
    # Upgrade distribution modules
    - python -m pip install --upgrade pip
    - pip install --upgrade setuptools

    # Install build dependencies
    - pip install --upgrade wheel
    - pip install --upgrade numpy

    # Print Python info
    - python ./ci/info_platform.py
    - pip list

    # Generate source package or wheel
    - python setup.py $BUILD_COMMAND
    - ls dist

script:
    # Upgrade distribution modules
    - pip install --upgrade setuptools
    - pip install --upgrade pip

    # Dependencies
    - pip install matplotlib
    - pip install fisx
    - pip install h5py
    - pip install silx
    - if [[ ! -z $QT_BINDING ]];
      then
          pip install $QT_BINDING;
      fi

    # Install from source package
    - pip install --pre --find-links dist/ --no-cache-dir --no-index PyMca5 $PIP_INSTALL_EXTRA_ARGS

    # Print Python info
    - python ci/info_platform.py
    - pip list

    # Run the tests
    - cd ..
    - python -m PyMca5.tests.TestAll
